server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # รองรับ Vue Router history mode - ให้ทุก path fallback ไปที่ index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # cache asset ที่ build แล้ว (มี hash ในชื่อไฟล์อยู่แล้ว)
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
}
